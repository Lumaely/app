name: lumaely_ui
description: "Lumaely's design system: tokens, theme and widgets."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Newsreader
      fonts:
        - asset: "fonts/Newsreader/Newsreader-VariableFont_opsz,wght.ttf"
        - asset: "fonts/Newsreader/Newsreader-Italic-VariableFont_opsz,wght.ttf"
          style: italic
    - family: Plus Jakarta Sans
      fonts:
        - asset: "fonts/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.ttf"
        - asset: "fonts/Plus_Jakarta_Sans/PlusJakartaSans-Italic-VariableFont_wght.ttf"
          style: italic
