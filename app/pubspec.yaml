name: lumaely
description: "Lumaely's iOS, Android, Desktop Application"
publish_to: 'none'

# https://developer.android.com/studio/publish/versioning
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  lumaely_core:
    path: ../packages/lumaely_core
  lumaely_crypto:
    path: ../packages/lumaely_crypto
  lumaely_data:
    path: ../packages/lumaely_data

  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  flutter_launcher_icons: ^0.14.4
  liquid_glass_widgets: ^1.17.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  riverpod_annotation: ^4.0.8
dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true

  # https://flutter.dev/to/resolution-aware-images
