name: Change request
description: Suggest a change to something Lumaely already does
labels: ["triage"]
type: "Change"
body:
  - type: textarea
    id: current
    attributes:
      label: How it works today
      description: What does the feature do now, and why isn't it right?
      placeholder: "ex: Insights only show the last 7 days, so long-term trends are invisible."
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: The need
      description: Write it as a user story if you can.
      placeholder: |
        As a [type of user, ex: long-time user],
        I want to [action, ex: choose the period of the mood chart],
        so that [goal, ex: I can see how my year went].
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: Proposed change
      placeholder: "ex: A period picker above the chart: week, month, year."
    validations:
      required: true

  - type: dropdown
    id: stored_data
    attributes:
      label: Does it change stored data?
      description: Data already saved in diaries (moods, moments, dates, keys) must keep working.
      options:
        - "No"
        - "Yes: existing diaries need a migration"
        - I don't know
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups
      description: Figma links, sketches or screenshots.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this change isn't requested yet.
          required: true
