name: Bug report
description: Something in Lumaely does not work as it should
labels: ["triage"]
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        > [!WARNING]
        > **Never paste diary content, a password or a recovery key**, not even
        > in logs or screenshots. Reproduce the bug in a test diary if you can.
        >
        > **Security issue?** Don't open an issue:
        > [report it privately](https://github.com/Lumaely/app/security/advisories/new).

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
      placeholder: "ex: The app closes when I save a day with no journal text."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Tap '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the bug seem to come from? Pick "I don't know" if unsure.
      options:
        - I don't know
        - Screens and navigation
        - Saving or reading days
        - Password, recovery key or unlocking
        - Appearance and themes
        - Build, tests or CI
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "ex: iPhone 17 (iOS 27.2), Redmi Note 11 (Android 13), iOS Simulator"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "ex: 0.1.0, or commit a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: build_mode
    attributes:
      label: Build mode
      options:
        - Debug
        - Profile
        - Release

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Check that nothing personal is visible before posting.
      placeholder: "Paste the relevant lines of `flutter run`, or drop images here."
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this bug isn't reported yet.
          required: true
        - label: This report contains no diary content, password or recovery key.
          required: true
