name: Feature request
description: Suggest something new for Lumaely
labels: ["triage"]
type: "Feature"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describe the need first: the best solution often
        comes out of the discussion.

  - type: textarea
    id: problem
    attributes:
      label: The need
      description: What is hard or impossible today? Write it as a user story if you can.
      placeholder: |
        As a [type of user, ex: privacy-conscious user],
        I want to [action, ex: lock the app with Face ID],
        so that [goal, ex: nobody holding my phone can read my diary].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work, for the person using the app?
      placeholder: "ex: Ask for Face ID when the app opens, with the diary password as a fallback."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to meet the need, and why they fit less.

  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does it store, show or send anything new about the person? Write "None" if not.
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups
      description: Figma links, sketches or screenshots.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this feature isn't requested yet.
          required: true
