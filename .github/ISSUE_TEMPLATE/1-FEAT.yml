name: Feature Request
description: Suggest an idea or a new feature for the Lumaely application
title: "‎ "
labels: ["app"]
type: "Feature"
body:
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: Describe the feature using a user story.
      placeholder: |
        As a [type of user, ex: privacy-conscious user],
        I want to [action, ex: lock the app with FaceID],
        So that [goal, ex: my journal remains safe from wandering eyes].
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: How do you see this feature working technically and/or visually?
      placeholder: "ex: Add a biometric lock screen on app startup using the local_auth Flutter package."
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups
      description: Add any other context, UI/UX wireframes, Figma links, or sketches about the feature request here.
      placeholder: "Drop your links or UI sketches here."

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      description: Please verify the following before submitting.
      options:
        - label: I have checked that this feature hasn't been requested already.
          required: true
