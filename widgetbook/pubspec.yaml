name: lumaely_widgetbook
description: "Catalog of Lumaely's design system, built with Widgetbook."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lumaely_ui:
    path: ../packages/lumaely_ui
  widgetbook: ^3.24.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  build_runner: ^2.16.1
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
